groups:
  - name: ip-sakti-pipeline
    rules:
      - alert: RetrievalFailureRateHigh
        expr: sum(rate(ip_sakti_stage_errors_total{stage=~"retrieval|retrieval.search|reranking"}[10m])) / clamp_min(sum(rate(ip_sakti_stage_requests_total{stage=~"retrieval|retrieval.search|reranking"}[10m])), 1) > 0.05
        for: 10m
        labels: { severity: page }
        annotations: { summary: "Retrieval pipeline error rate exceeds 5%" }
      - alert: LlmFailureRateHigh
        expr: sum(rate(ip_sakti_stage_errors_total{stage="llm.generation"}[10m])) / clamp_min(sum(rate(ip_sakti_stage_requests_total{stage="llm.generation"}[10m])), 1) > 0.03
        for: 10m
        labels: { severity: page }
        annotations: { summary: "LLM generation error rate exceeds 3%" }
      - alert: PipelineLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(ip_sakti_stage_duration_seconds_bucket{stage=~"retrieval|llm.generation"}[10m]))) > 5
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "p95 retrieval or LLM stage latency exceeds 5 seconds" }
      - alert: CitationValidationFailures
        expr: sum(rate(ip_sakti_citation_validation_failures_total[10m])) > 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Citation validation failures are occurring" }
      - alert: EscalationSpike
        expr: sum(rate(ip_sakti_escalations_total[15m])) * 900 > 10
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "More than 10 escalations in 15 minutes" }
