[project]
name = "ip-sakti-sahayak-backend"
version = "0.1.0"
description = "IP-SAKTI Sahayak backend"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "asyncpg>=0.30,<1.0",
  "httpx>=0.28,<1.0",
  "PyYAML>=6.0,<7.0",
  "pydantic-settings>=2.7,<3.0",
  "alembic>=1.14,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "opentelemetry-api>=1.29,<2.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.29,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1.0",
  "opentelemetry-sdk>=1.29,<2.0",
  "cryptography>=50,<51",
  "google-cloud-secret-manager>=2.20,<3.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0,<10.0",
  "pytest-asyncio>=1.0,<2.0",
  "types-PyYAML>=6.0,<7.0",
  "mypy>=1.15,<2.0",
  "ruff>=0.9,<1.0",
  "pip-audit>=2.8,<3.0",
]

[tool.uv]
default-groups = ["dev"]

[project.scripts]
ingest = "app.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
