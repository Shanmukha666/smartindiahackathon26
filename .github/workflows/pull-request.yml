name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.14"
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml

      - name: Install backend dependencies
        run: uv sync --dev

      - name: Enforce dedicated, provenance-complete corpus pull requests
        shell: bash
        run: |
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          corpus_files="$(printf '%s\n' "$changed" | grep '^corpus/' || true)"
          test -z "$corpus_files" && exit 0
          non_corpus_files="$(printf '%s\n' "$changed" | grep -v '^corpus/' || true)"
          test -z "$non_corpus_files" || {
            echo "Corpus changes must ship in a dedicated PR; non-corpus files found:" >&2
            printf '%s\n' "$non_corpus_files" >&2
            exit 1
          }
          while IFS= read -r path; do
            uv run python -c 'from pathlib import Path; from app.ingest import parse_source_file; source = parse_source_file(Path(__import__("sys").argv[1])); assert source.metadata.source_url and source.metadata.retrieved_at' "$path"
          done <<< "$corpus_files"

      - name: Require versioned prompt evaluation for policy changes
        shell: bash
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- backend/app/ask.py backend/app/prompt_policy.py; then exit 0; fi
          git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- backend/eval/prompt_manifest.json && {
            echo "A system prompt policy change requires a versioned prompt manifest." >&2
            exit 1
          }
          base_version="$(git show "origin/${{ github.base_ref }}:backend/eval/prompt_manifest.json" | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          current_version="$(python -c 'import json; print(json.load(open("backend/eval/prompt_manifest.json"))["version"])')"
          test "$base_version" != "$current_version" || {
            echo "A system prompt policy change requires a new prompt manifest version." >&2
            exit 1
          }

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type-check with mypy
        run: uv run mypy app

      - name: Run backend tests
        run: uv run pytest

      - name: Run red-team suite explicitly
        run: uv run pytest tests/test_red_team.py

      - name: Scan Python dependencies
        run: uv run pip-audit

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npm run lint

      - name: Type-check with TypeScript
        run: npm run typecheck

      - name: Run frontend tests
        run: npm run test

      - name: Build production frontend
        run: npm run build

      - name: Scan JavaScript dependencies
        run: npm audit --audit-level=high

  demo-mode-smoke:
    name: Demo-mode smoke test
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.14"
      - run: uv sync --dev
      - name: Start demo backend and verify core endpoints
        env:
          DEMO_MODE: "true"
          DEPLOYMENT_ENVIRONMENT: development
          APP_NAME: ip-sakti-sahayak
          DATABASE_URL: postgresql://demo.invalid/ipsakti
          JWT_SIGNING_KEY: ci-demo-signing-key-not-for-production-use
          CREDENTIAL_KEK_SECRET_RESOURCE: projects/demo/secrets/credential-kek/versions/latest
          VOYAGE_API_URL: https://api.voyageai.com/v1/embeddings
          VOYAGE_MODEL: voyage-3
          OTEL_SERVICE_NAME: ip-sakti-backend
          OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
          OTEL_TRACES_EXPORTER: none
          OTEL_METRICS_EXPORTER: none
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _ in $(seq 1 20); do curl -sf http://127.0.0.1:8000/health && break; sleep 0.5; done
          curl -sf -X POST http://127.0.0.1:8000/retrieve -H 'Content-Type: application/json' -d '{"query":"traditional knowledge exclusion","jurisdiction":"IN"}' | grep -q 'demo-patents-act-section-3-p-1'
          curl -sf -X POST http://127.0.0.1:8000/ask -H 'Content-Type: application/json' -d '{"query":"What does Section 3(p) exclude?","jurisdiction":"IN","session_id":"ci-smoke"}' | grep -q '"abstain":false'
          curl -sf -X POST http://127.0.0.1:8000/classify/next -H 'Content-Type: application/json' -d '{"session_id":"ci-smoke","trail":[],"answer_index":null}' | grep -q '"complete":false'

  docker:
    name: Build backend Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --file backend/Dockerfile --tag ip-sakti-sahayak-backend:${{ github.sha }} backend

  evaluation:
    name: Regression evaluation
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.14"
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml

      - name: Install backend dependencies
        run: uv sync --dev

      - name: Read baseline from main
        run: git show origin/main:backend/eval/baseline.json > /tmp/main-eval-baseline.json

      - name: Run evaluation against main baseline
        run: uv run python eval/run_eval.py --offline --compare-to /tmp/main-eval-baseline.json
        env:
          EVAL_MAX_REGRESSION: ${{ vars.EVAL_MAX_REGRESSION || '0.05' }}
